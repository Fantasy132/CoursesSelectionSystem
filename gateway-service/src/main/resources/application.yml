server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false  # 禁用版本兼容性检查
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: dev
        group: COURSEHUB_GROUP
        ephemeral: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        enabled: ${NACOS_ENABLED:true}
        metadata:
          version: 1.0.0
          service-type: api-gateway
        watch:
          enabled: true
        register-enabled: true
    gateway:
      # 启用服务发现路由
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 路由配置
      routes:
        # Catalog Service 路由 - 课程管理
        - id: catalog-service-courses
          uri: lb://catalog-service
          predicates:
            - Path=/api/courses/**
          filters:
            - name: CircuitBreaker
              args:
                name: catalogCircuitBreaker
                fallbackUri: forward:/fallback/catalog
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # Enrollment Service 路由 - 选课管理
        - id: enrollment-service-enrollments
          uri: lb://enrollment-service
          predicates:
            - Path=/api/enrollments/**
          filters:
            - name: CircuitBreaker
              args:
                name: enrollmentCircuitBreaker
                fallbackUri: forward:/fallback/enrollment
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # User Service 路由 - 学生管理
        - id: user-service-students
          uri: lb://user-service
          predicates:
            - Path=/api/students/**
          filters:
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # User Service 路由 - 认证接口
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/user

      # 全局跨域配置（通过 CorsConfiguration.java 类配置）
      # 支持 JWT 认证场景的跨域访问
      globalcors:
        cors-configurations:
          '[/**]':
            # 允许的源（开发环境）
            # 生产环境建议指定具体域名，如：http://example.com
            allowedOriginPatterns: "*"
            
            # 允许的 HTTP 方法
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            
            # 允许的请求头（支持 Authorization 等自定义头）
            allowedHeaders: "*"
            
            # 暴露给客户端的响应头
            exposedHeaders:
              - Authorization
              - X-Token-Refresh-Required
              - X-User-Id
              - X-User-Name
              - Content-Type
              - Content-Length
            
            # 是否允许携带凭证（JWT 不需要 Cookie，设为 false）
            allowCredentials: false
            
            # 预检请求缓存时间（秒）
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacos-discovery,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    nacos:
      enabled: true
    circuitbreakers:
      enabled: true

# Resilience4j 配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      catalogCircuitBreaker:
        baseConfig: default
      enrollmentCircuitBreaker:
        baseConfig: default
      userCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      catalogCircuitBreaker:
        baseConfig: default
      enrollmentCircuitBreaker:
        baseConfig: default
      userCircuitBreaker:
        baseConfig: default

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.alibaba.nacos: INFO
    io.github.resilience4j: INFO
    com.zjsu.ybz.gateway.filter.JwtAuthenticationFilter: DEBUG

# JWT 配置
jwt:
  # JWT 密钥（必须至少 64 字节以支持 HS512 算法）
  # 生产环境务必修改此密钥！
  secret: YourSecretKeyForJWTTokenGenerationMustBeAtLeast512BitsLongForHS512AlgorithmPleaseChangeThisInProduction
  # Token 有效期（毫秒）：24 小时
  expiration: 86400000
