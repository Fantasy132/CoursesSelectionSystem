server:
  port: 8102

spring:
  application:
    name: enrollment-service
  cloud:
    compatibility-verifier:
      enabled: false  # 禁用版本兼容性检查
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: dev
        group: COURSEHUB_GROUP
        ephemeral: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        enabled: ${NACOS_ENABLED:true}
        username: nacos
        password: nacos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:33080/enrollment_db?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:enrollment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:enrollment_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 课程目录服务配置（使用 Nacos 服务发现）
# user-service:
#   name: user-service  # Nacos 中的服务名

  # 服务地址配置
user-service:
  url: ${USER_SERVICE_URL:http://localhost:8100}  # 开发环境
  # url: http://user-service:8100  # Docker环境（通过环境变量设置）

catalog-service:
  url: ${CATALOG_SERVICE_URL:http://localhost:8101}  # 开发环境
  # url: http://catalog-service:8101  # Docker环境（通过环境变量设置）