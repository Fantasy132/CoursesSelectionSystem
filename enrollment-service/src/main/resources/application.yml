server:
  port: 8102

spring:
  application:
    name: enrollment-service
  cloud:
    compatibility-verifier:
      enabled: false  # 禁用版本兼容性检查
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: dev
        group: COURSEHUB_GROUP
        ephemeral: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        enabled: ${NACOS_ENABLED:true}
        # 添加元数据
        metadata:
          version: 1.0.0
          service-type: enrollment-management
        # 健康检查配置
        watch:
          enabled: true
        register-enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:33080/enrollment_db?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:enrollment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:enrollment_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacos-discovery
  endpoint:
    health:
      show-details: always
  health:
    nacos:
      enabled: true
