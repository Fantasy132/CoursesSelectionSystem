server:
  port: 8100

spring:
  application:
    name: user-service
  cloud:
    compatibility-verifier:
      enabled: false  # 禁用版本兼容性检查
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: dev
        group: COURSEHUB_GROUP
        ephemeral: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        enabled: ${NACOS_ENABLED:true}
        # 添加元数据
        metadata:
          version: 1.0.0
          service-type: user-management
        # 健康检查配置
        watch:
          enabled: true
        register-enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:33061/user_db?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:user_user}
    password: ${SPRING_DATASOURCE_PASSWORD:user_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacos-discovery
  endpoint:
    health:
      show-details: always
  health:
    nacos:
      enabled: true

# JWT 配置（HS512 算法）
jwt:
  # 密钥必须至少 64 字节（512 位）以支持 HS512 算法
  secret: YourSecretKeyForJWTTokenGenerationMustBeAtLeast512BitsLongForHS512AlgorithmPleaseChangeThisInProduction
  expiration: 86400000  # 24小时（86400000 毫秒）

# 课程目录服务配置（使用 Nacos 服务发现）
catalog-service:
  name: catalog-service  # Nacos 中的服务名